<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Monaco Editor</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="monaco/vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: 'monaco/vs' } });
        let suppressChangeNotification = false;
        let pendingEditorOptions = window.__initOpts || { theme: 'vs-dark', fontSize: 14, wordWrap: false, minimap: false };
        document.body.style.backgroundColor = pendingEditorOptions.theme === 'vs' ? '#fffffe' : '#1e1e1e';

        function postMessage(message) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(message);
            }
        }
        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('container'), {
                value: '',
                language: 'csharp',
                theme: pendingEditorOptions.theme,
                fontSize: pendingEditorOptions.fontSize,
                wordWrap: pendingEditorOptions.wordWrap ? 'on' : 'off',
                automaticLayout: true,
                minimap: { enabled: !!pendingEditorOptions.minimap },
                mouseWheelZoom: false
            });

            window.setEditorOptions = function (o) {
                pendingEditorOptions = o || pendingEditorOptions;
                monaco.editor.setTheme(pendingEditorOptions.theme);
                editor.updateOptions({
                    fontSize: pendingEditorOptions.fontSize,
                    wordWrap: pendingEditorOptions.wordWrap ? 'on' : 'off',
                    minimap: { enabled: !!pendingEditorOptions.minimap }
                });
                document.body.style.backgroundColor = pendingEditorOptions.theme === 'vs' ? '#fffffe' : '#1e1e1e';
            };
            window.setEditorOptions(pendingEditorOptions);

            editor.onDidChangeModelContent(function () {
                if (!suppressChangeNotification) postMessage({ type: 'changed' });
            });

            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
                postMessage({ type: 'command', name: 'save' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyN, function () {
                postMessage({ type: 'command', name: 'new' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyF, function () {
                postMessage({ type: 'command', name: 'search' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Equal, function () {
                postMessage({ type: 'command', name: 'fontInc' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.Equal, function () {
                postMessage({ type: 'command', name: 'fontInc' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.NumpadAdd, function () {
                postMessage({ type: 'command', name: 'fontInc' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Minus, function () {
                postMessage({ type: 'command', name: 'fontDec' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.NumpadSubtract, function () {
                postMessage({ type: 'command', name: 'fontDec' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Digit0, function () {
                postMessage({ type: 'command', name: 'fontReset' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Numpad0, function () {
                postMessage({ type: 'command', name: 'fontReset' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyC, function () {
                postMessage({ type: 'command', name: 'copy' });
            });

            window.setEditorCode = function (value) {
                suppressChangeNotification = true;
                try { editor.setValue(value || ''); }
                finally { suppressChangeNotification = false; }
            };

            window.setLanguage = function (id) {
                if (editor && editor.getModel()) {
                    monaco.editor.setModelLanguage(editor.getModel(), id || 'plaintext');
                }
            };

            postMessage({ type: 'ready' });
        });
    </script>
</body>
</html>
