<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Monaco Editor</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #1e1e1e; }
        #container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="monaco/vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: 'monaco/vs' } });
        let suppressChangeNotification = false;

        function postMessage(message) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(message);
            }
        }
        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('container'), {
                value: '',
                language: 'csharp',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false }
            });

            editor.onDidChangeModelContent(function () {
                if (!suppressChangeNotification) postMessage({ type: 'changed' });
            });

            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
                postMessage({ type: 'command', name: 'save' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyN, function () {
                postMessage({ type: 'command', name: 'new' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyF, function () {
                postMessage({ type: 'command', name: 'search' });
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyC, function () {
                postMessage({ type: 'command', name: 'copy' });
            });

            window.setEditorCode = function (value) {
                suppressChangeNotification = true;
                try { editor.setValue(value || ''); }
                finally { suppressChangeNotification = false; }
            };

            window.setLanguage = function (id) {
                if (editor && editor.getModel()) {
                    monaco.editor.setModelLanguage(editor.getModel(), id || 'plaintext');
                }
            };

            postMessage({ type: 'ready' });
        });
    </script>
</body>
</html>
